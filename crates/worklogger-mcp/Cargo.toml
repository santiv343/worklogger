[package]
name = "worklogger-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "worklogger-mcp"
path = "src/main.rs"

[features]
default = ["jira", "bitbucket"]
jira = ["dep:hours-core", "dep:jira-adapter"]
bitbucket = ["dep:bitbucket-adapter"]
managed-distribution = []

[dependencies]
atomic-write-file = "0.3"
crossterm.workspace = true
bitbucket-adapter = { path = "../bitbucket-adapter", optional = true }
hours-core = { path = "../hours-core", optional = true }
jira-adapter = { path = "../jira-adapter", optional = true }
rmcp.workspace = true
ratatui.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
worklogger-credentials = { path = "../worklogger-credentials" }
worklogger-profile = { path = "../worklogger-profile" }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }

[build-dependencies]
worklogger-profile = { path = "../worklogger-profile" }

[lints]
workspace = true
