<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Secure Worklogger MCP flow</title>
  <desc id="description">Steps to configure MCP and the preview and confirmation cycle before an action.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f6f2ff"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2b1e52" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#background)"/>
  <text x="60" y="66" fill="#2a2248" font-family="Arial, sans-serif" font-size="29" font-weight="700">MCP: configure once, confirm every change</text>
  <text x="60" y="98" fill="#5f5978" font-family="Arial, sans-serif" font-size="17">Queries are read-only. Every data-changing action requires your confirmation.</text>
  <g font-family="Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="60" y="140" width="212" height="92" rx="18" fill="#fff"/>
      <rect x="302" y="140" width="212" height="92" rx="18" fill="#fff"/>
      <rect x="544" y="140" width="212" height="92" rx="18" fill="#fff"/>
      <rect x="786" y="140" width="354" height="92" rx="18" fill="#fff"/>
      <rect x="245" y="277" width="310" height="72" rx="18" fill="#fff"/>
      <rect x="645" y="277" width="310" height="72" rx="18" fill="#fff"/>
    </g>
    <path d="M272 186H302M514 186H544M756 186H786M960 232V255H400V277M555 313H645" stroke="#9b7ad6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="88" cy="163" r="16" fill="#7651c6"/><text x="88" y="168">1</text>
      <circle cx="330" cy="163" r="16" fill="#7651c6"/><text x="330" y="168">2</text>
      <circle cx="572" cy="163" r="16" fill="#7651c6"/><text x="572" y="168">3</text>
      <circle cx="814" cy="163" r="16" fill="#7651c6"/><text x="814" y="168">4</text>
      <circle cx="273" cy="299" r="16" fill="#7651c6"/><text x="273" y="304">5</text>
      <circle cx="673" cy="299" r="16" fill="#7651c6"/><text x="673" y="304">6</text>
    </g>
    <g fill="#2a2248" font-size="17" font-weight="700">
      <text x="109" y="181">Configure</text><text x="109" y="204">your account</text>
      <text x="351" y="181">Choose</text><text x="351" y="204">capabilities</text>
      <text x="593" y="181">Install in</text><text x="593" y="204">your client</text>
      <text x="835" y="181">Ask your assistant</text><text x="835" y="204">to take an action</text>
      <text x="294" y="321">Review the preview</text>
      <text x="694" y="321">Confirm or cancel</text>
    </g>
    <g fill="#6b6384" font-size="13">
      <text x="109" y="222">Desktop or assistant</text><text x="351" y="222">Only what you need</text><text x="593" y="222">Restart the client</text><text x="835" y="222">E.g. time, issue, or PR</text>
      <text x="294" y="341">Identity, target, and effect</text><text x="694" y="341">Single-use token</text>
    </g>
  </g>
</svg>
