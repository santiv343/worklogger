[package]
name = "worklogger-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
atomic-write-file = { version = "0.3", optional = true }
# Restringe la dependencia transitiva de printpdf al MSRV 1.88 del workspace.
aes = { version = "=0.9.2", optional = true }
dioxus = { workspace = true, optional = true }
dioxus-charts = { version = "0.4.0", optional = true }
hours-core = { path = "../crates/hours-core", optional = true }
jira-adapter = { path = "../crates/jira-adapter", optional = true }
printpdf = { version = "0.12.7", default-features = false, optional = true }
rfd = { version = "0.17.2", optional = true }
rust_xlsxwriter = { version = "0.95.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
worklogger-credentials = { path = "../crates/worklogger-credentials", optional = true }
worklogger-mcp = { path = "../crates/worklogger-mcp", default-features = false, optional = true }
worklogger-profile = { path = "../crates/worklogger-profile" }

[features]
default = ["hours", "reports", "mcp-jira", "mcp-bitbucket", "configurable-organization"]
configurable-organization = []
jira = ["dep:jira-adapter"]
managed-distribution = ["worklogger-mcp?/managed-distribution"]
mcp-management = ["dep:tokio", "dep:worklogger-credentials", "dep:worklogger-mcp"]
mcp-jira = ["mcp-management", "worklogger-mcp/jira"]
mcp-bitbucket = ["mcp-management", "worklogger-mcp/bitbucket"]
reports = [
    "dep:atomic-write-file",
    "dep:aes",
    "dep:dioxus-charts",
    "dep:printpdf",
    "dep:rfd",
    "dep:rust_xlsxwriter",
]
dev-desktop = [
    "jira",
    "reports",
    "dep:dioxus",
    "dioxus/desktop",
    "dep:hours-core",
    "dep:time",
    "mcp-jira",
    "mcp-bitbucket",
]
hours = [
    "jira",
    "dep:hours-core",
    "dep:atomic-write-file",
    "dep:rfd",
    "dep:thiserror",
    "dep:time",
    "dep:worklogger-credentials",
]

[target.'cfg(windows)'.dependencies]
dioxus = { workspace = true, features = ["desktop"] }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
